[metadata]
name = ichor-core
version = attr: ichor.core.__version__
author = Matthew Burn, Yulian Manchev, Adam Hill, Olivia Aten
author_email = matthew.burn@postgrad.manchester.ac.uk, yulian.manchev@postgrad.manchester.ac.uk, adam.hill@manchester.ac.uk, olivia.aten@student.manchester.ac.uk
maintainer = Yulian Manchev, Adam Hill, Olivia Aten
maintainer_email = yulian.manchev@postgrad.manchester.ac.uk, adam.hill@manchester.ac.uk, olivia.aten@student.manchester.ac.uk
description = ICHOR core package
long_description = file: README.md
long_description_content_type = text/markdown
project_urls =
    github = https://github.com/popelier-group/ICHOR
classifiers=
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Operating System :: OS Independent

[options]
packages = find_namespace:
install_requires =
    matplotlib
    numpy
    pandas
    pyarrow
    typing-extensions
    SQLAlchemy
    xlsxwriter
    natsort
    ase
    tqdm
    rdkit
    # xtb is deliberately not listed. ichor never imports it: it only writes
    # `from xtb.ase.calculator import XTB` into the scripts it generates, and those
    # run in the conda environment named by `software.python` in the ichor config
    # file, not in ichor's own environment. The PyPI wheels also stop at CPython
    # 3.11, so depending on it here would cap the Python version ichor can run on.
    # See ichor.hpc.check_python_env.
tests_require = pytest
python_requires = >=3.10

[options.packages.find]
include = ichor*

[options.extras_require]
dev =
    pytest
    sphinx
    nbconvert
    pre-commit
    cclib
    sphinx-rtd-theme
    nbsphinx
    myst_parser
    ipython
    ipykernel
    nbval

[bdist_wheel]
python-tag=py3
