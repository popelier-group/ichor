[metadata]
name = ichor-core
version = 2.0.0
author = Matthew Burn, Yulian Manchev, Adam Hill, Olivia Aten
author_email = matthew.burn@postgrad.manchester.ac.uk, yulian.manchev@postgrad.manchester.ac.uk, adam.hill@manchester.ac.uk, olivia.aten@student.manchester.ac.uk
maintainer = Yulian Manchev, Adam Hill, Olivia Aten
maintainer_email = yulian.manchev@postgrad.manchester.ac.uk, adam.hill@manchester.ac.uk, olivia.aten@student.manchester.ac.uk
description = ICHOR core package
long_description = file: README.md
long_description_content_type = text/markdown
project_urls =
    github = https://github.com/popelier-group/ICHOR
classifiers=
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Operating System :: OS Independent

[options]
packages = find_namespace:
install_requires =
    matplotlib
    numpy
    pandas
    pyarrow
    typing-extensions
    SQLAlchemy
    xlsxwriter
    natsort
    ase
    tqdm
    rdkit
    # the xtb wheels on PyPI only build for CPython <= 3.11. ichor never imports
    # xtb itself (it only writes `from xtb.ase.calculator import XTB` into the
    # scripts it generates), so it is skipped on newer interpreters. On 3.12+
    # install it into the environment that runs those scripts with
    # `conda install -c conda-forge xtb-python`.
    xtb; python_version < "3.12"
tests_require = pytest
python_requires = >=3.8

[options.extras_require]
dev =
    pytest
    sphinx
    nbconvert
    pre-commit
    cclib
    sphinx-rtd-theme
    nbsphinx
    myst_parser
    ipython
    ipykernel
    nbval

[bdist_wheel]
python-tag=py38
