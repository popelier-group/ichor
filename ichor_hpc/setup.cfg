[metadata]
name = ichor-hpc
version = attr: ichor.hpc.__version__
author = Matthew Burn, Yulian Manchev
author_email = matthew.burn@postgrad.manchester.ac.uk, yulian.manchev@postgrad.manchester.ac.uk
maintainer = Yulian Manchev
maintainer_email = yulian.manchev@postgrad.manchester.ac.uk
description = ICHOR hpc package
long_description = file: README.md
long_description_content_type = text/markdown
project_urls =
    github = https://github.com/popelier-group/ICHOR
classifiers=
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Operating System :: OS Independent

[options]
packages = find_namespace:
install_requires =
    ichor-core
    pyyaml
    concurrent-log-handler
python_requires = >=3.10

[options.packages.find]
include = ichor*

[options.package_data]
ichor.hpc =
    data/*.yaml

[options.entry_points]
console_scripts =
    ichor-config-init = ichor.hpc.config_init:main

[bdist_wheel]
python-tag=py3
