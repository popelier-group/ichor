name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  run_linter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        pip install pre-commit
        pre-commit install
    - name: Run pre-commit
      run: | # taken from https://pre-commit.com/#pre-commit-run
        git ls-files -- '*.py' | xargs pre-commit run --files
    # upload when open sourced
    # - name: Upload coverage reports to Codecov
    #   uses: codecov/codecov-action@v3

  run_unit_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported version and the newest one, so that a dependency
        # which quietly drops either end is caught
        python-version: ["3.10", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install -e ichor_core[dev] -e ichor_hpc -e ichor_cli
    - name: Run pytest
      run: |
        pytest ichor_core/tests ichor_hpc/tests

  run_examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        pip install -e ichor_core[dev] -e ichor_hpc -e ichor_cli
    - name: Run example notebooks
      run: |
        git ls-files -- '*.ipynb' | xargs pytest --nbval-lax --nbval-current-env
